name: Compile Custom 13.60 Payload
on: [push, workflow_dispatch]

jobs:
  build-bin:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib clang lld llvm

      - name: Execute Local Makefile Compilation
        run: |
          # Run the standard compiler directly on the runner machine
          chmod +x ./build_bearssl.sh ./build_isal_crypto.sh ./build_libtomcrypt.sh 2>/dev/null || true
          make

      - name: Upload Compiled Binary to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Kstuff-13.60-Binary
          path: |
            kstuff.bin
            payload.bin
            *.bin
